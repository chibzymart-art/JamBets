    <button type="button" id="retry">Try again</button>
    <div class="status"><span class="dot"></span><span id="status-text">Waiting for a connection…</span></div>
  </main>
  <script>
    (function () {
      function go() { window.location.reload(); }
      document.getElementById('retry').addEventListener('click', go);
      // Come back by itself as soon as the phone is online again.
      window.addEventListener('online', function () {
        document.getElementById('status-text').textContent = 'Back online, loading…';
        setTimeout(go, 400);
      });
    })();
  </script>
</body>
</html>
