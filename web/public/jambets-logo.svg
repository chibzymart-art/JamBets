<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 5 445 118" width="100%" height="100%" fill="none">
  <defs>
    <!-- Deep/Vibrant Green for the main text -->
    <linearGradient id="emeraldGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <!-- Neon Red specifically for the accent star -->
    <linearGradient id="brandRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 80)">
    <!-- Main Typographic Wordmark -->
    <text x="0" y="0" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-weight="900" font-size="82" letter-spacing="-2.5">
      <!-- Deep Forest Green for high contrast on white -->
      <tspan fill="#064E3B">Odds</tspan><tspan fill="url(#emeraldGreen)">Banta</tspan>
    </text>
    
    <!-- Red Accent Spark / Star -->
    <path d="M 405 -65 Q 405 -45 425 -45 Q 405 -45 405 -25 Q 405 -45 385 -45 Q 405 -45 405 -65" fill="url(#brandRed)"/>

    <!-- Clean, AI-Free Subtitle -->
    <text x="3" y="32" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" letter-spacing="3.5">
      <tspan fill="#475569">SMART SPORTS ANALYSIS AND PREDICTION</tspan>
    </text>
  </g>
</svg>