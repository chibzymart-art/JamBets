    <!-- Critical Server-Side Rendering (SSR) & Initial Loading Shell Styling -->

      #ssr-content.ssr-content {
        min-height: 100vh;
        background-color: #080c15;

        background: rgba(11, 15, 25, 0.95);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .ssr-nav-inner {
        max-width: 1240px;
        margin: 0 auto;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }
      .ssr-brand-logo {
        display: flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
        font-weight: 800;
        font-size: 1.25rem;
        color: #ffffff;
        letter-spacing: -0.02em;
      }
      .ssr-logo-badge {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: #ffffff;
        padding: 2px 7px;
        border-radius: 6px;
        font-size: 0.85rem;
        font-weight: 900;
      }
      .ssr-nav-links {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .ssr-nav-pill {
        display: inline-flex;
        align-items: center;
        padding: 6px 14px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.05);
        color: #cbd5e1;
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 500;
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: all 0.2s ease;
      }
      .ssr-nav-pill:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        border-color: rgba(255, 255, 255, 0.18);
      }
      .ssr-engine-status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8rem;
        font-weight: 500;
        color: #10b981;
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.25);
        padding: 4px 12px;
        border-radius: 9999px;
      }
      .ssr-live-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 8px #10b981;
        display: inline-block;
        animation: ssrPulse 1.8s infinite;
      }
      @keyframes ssrPulse {
        0% { transform: scale(0.95); opacity: 0.7; }
        50% { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(0.95); opacity: 0.7; }

        margin: 0 auto;

      .ssr-content a {

      }

      }

      .ssr-skeleton-grid {

      .ssr-skel-line.w-60 { width: 60%; }
      .ssr-skel-line.w-80 { width: 80%; }
      @keyframes ssrShimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      .ssr-content section {
        background: #0f172a;
        border: 1px solid rgba(255, 255, 255, 0.08);

        padding: 24px;
        margin-bottom: 24px;

        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;

      .ssr-content th {

        color: #94a3b8;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;

      }
      .ssr-content td {

        font-size: 0.88rem;
      }

      }
      .ssr-content td small {

      .ssr-content ul {
        list-style: none;
        padding: 0;
        margin: 16px 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 12px;
      }
      .ssr-content ul li {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        padding: 12px 16px;
        border-radius: 10px;
        color: #cbd5e1;
        font-size: 0.88rem;
        line-height: 1.4;
      }
      .ssr-content footer {
        margin-top: 48px;
        padding-top: 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        text-align: center;
        color: #64748b;
        font-size: 0.82rem;
      }
      .ssr-content footer p {
        color: #64748b;
        margin-bottom: 8px;
      }
      @media (max-width: 640px) {
        .ssr-content main { padding: 20px 14px 40px; }
        .ssr-content h1 { font-size: 1.5rem; }
        .ssr-skeleton-grid { grid-template-columns: 1fr; }
        .ssr-content ul { grid-template-columns: 1fr; }
      }
    </style>

    <!-- Auto-recovery listener: refreshes page once if a script or chunk fails due to an in-flight deployment rollout -->
    <script>
      (function() {
        window.addEventListener('error', function(e) {
          var msg = e && e.message ? String(e.message) : '';
          var isChunkErr = msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
                           msg.indexOf('error loading dynamically imported module') !== -1 ||
                           msg.indexOf('Importing a module script failed') !== -1;
          var isScriptTagErr = e && e.target && e.target.tagName === 'SCRIPT';
          if (isChunkErr || isScriptTagErr) {
            var retryKey = 'oddsbanta_deploy_reload_' + (e.target && e.target.src ? e.target.src : 'chunk');
            if (!sessionStorage.getItem(retryKey)) {
              sessionStorage.setItem(retryKey, '1');
              window.location.reload();
            }
          }
        }, true);
      })();
    </script>
