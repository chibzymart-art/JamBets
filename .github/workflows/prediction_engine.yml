name: JamBets Automated Prediction Engine (Every 2 Days)

on:
  schedule:
    # Run every 2 days at Midnight WAT (23:00 UTC)
    - cron: '0 23 */2 * *'
  workflow_dispatch:

concurrency:
  group: prediction-engine
  cancel-in-progress: false

jobs:
  predict:
    name: ${{ matrix.engine.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine:
          - name: "Core Football Prediction Engine"
            command: "python -m python.src.run_predictions"
          - name: "Goals Specialist Engine"
            command: "python -m python.src.goals.run_goals_cycle --predict-only"
          - name: "Decoupled Specialists Engine"
            command: "python -m python.src.engines.run_all_specialists --predict-only"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Execute Prediction Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALERT_EMAIL_SENDER: ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_RECIPIENTS: ${{ secrets.ALERT_EMAIL_RECIPIENTS }}
        run: |
          echo "=== RUNNING ${{ matrix.engine.name }} ==="
          ${{ matrix.engine.command }}

      - name: Dispatch Prediction Failure Email Alert
        if: failure()
        env:
          ALERT_EMAIL_SENDER: ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_RECIPIENTS: ${{ secrets.ALERT_EMAIL_RECIPIENTS }}
        run: |
          python -c "from python.src.alerts.email_notifier import send_pipeline_failure_alert; send_pipeline_failure_alert('${{ matrix.engine.name }} (GitHub Actions)', Exception('Workflow matrix job failed'), {'run_id': '${{ github.run_id }}', 'run_url': 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'})"

