name: JamBets Automated Prediction Engine (Daily)

on:
  schedule:
    # Daily at Midnight WAT (23:00 UTC)
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: prediction-engine
  cancel-in-progress: false

jobs:
  predict:
    name: Run Daily Prediction Pipelines
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Execute Core Football Prediction Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "=== RUNNING CORE FOOTBALL PREDICTION PIPELINE (250K SIMS) ==="
          python -m python.src.run_predictions

      - name: Execute Goals Specialist Prediction Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "=== RUNNING GOALS SPECIALIST PREDICTION ENGINE ==="
          python -m python.src.goals.run_goals_cycle --predict-only
