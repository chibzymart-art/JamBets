name: Cricket Engine Back-test (manual)

# Phase 1 of the cricket engine: walk-forward back-test on Cricsheet history.
# Manual only. Uses no secrets and writes nothing to Supabase; the report and
# predictions are uploaded as a workflow artifact.

on:
  workflow_dispatch:
    inputs:
      eval_start:
        description: 'First match date to predict'
        required: false
        default: '2019-01-01'
      test_start:
        description: 'Start of the untouched test period'
        required: false
        default: '2024-01-01'
      sims:
        description: 'Monte Carlo simulations per match'
        required: false
        default: '2000'

concurrency:
  group: cricket-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Download Cricsheet history and build cache
        run: |
          mkdir -p cricket_data
          python -c "
          import logging; logging.basicConfig(level=logging.INFO)
          from python.src.cricket.history import download_archives, load_archives, save_cache
          save_cache(load_archives(download_archives('cricket_data')), 'cricket_data/history.json.gz')
          "

      - name: Walk-forward simulation (4 parallel shards)
        run: |
          for i in 0 1 2 3; do
            python -m python.src.cricket.backtest simulate \
              --cache cricket_data/history.json.gz --out cricket_data/preds_$i.jsonl \
              --eval-start "${{ github.event.inputs.eval_start || '2019-01-01' }}" \
              --sims "${{ github.event.inputs.sims || '2000' }}" \
              --shard $i --shards 4 &
          done
          wait

      - name: Analyse and write report
        run: |
          python -m python.src.cricket.backtest analyse \
            --preds cricket_data/preds_0.jsonl,cricket_data/preds_1.jsonl,cricket_data/preds_2.jsonl,cricket_data/preds_3.jsonl \
            --report cricket_data/backtest_report.md \
            --test-start "${{ github.event.inputs.test_start || '2024-01-01' }}"
          cat cricket_data/backtest_report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: cricket-backtest
          path: |
            cricket_data/backtest_report.md
            cricket_data/preds_*.jsonl
          retention-days: 30
