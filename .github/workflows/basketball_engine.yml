name: JamBets Autonomous Basketball Prediction Engine (Daily Cadence)

on:
  schedule:
    # Run daily at 2:00 AM WAT (01:00 UTC) - 60 minutes after Football Goals completes
    - cron: '0 1 * * *'
  push:
    branches:
      - main
    paths:
      - 'python/src/basketball/**'
      - '.github/workflows/basketball_engine.yml'
  workflow_dispatch:
    inputs:
      days_forward:
        description: 'Forward horizon window in days (default: 4)'
        required: false
        default: '4'
      simulations:
        description: 'Monte Carlo simulations count per match (default: 250000)'
        required: false
        default: '250000'
      wipe_all:
        description: 'Wipe all existing basketball predictions before running fresh pass'
        type: boolean
        required: false
        default: false

concurrency:
  group: basketball-prediction-engine
  cancel-in-progress: true

jobs:
  basketball-prediction-cycle:
    name: Autonomous Basketball Ingestion & 250k Monte Carlo Simulation Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Execute Scoreboard Ingestion & Schedule
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "=== RUNNING BASKETBALL SCOREBOARD & SCHEDULE INGESTION (CURRENT TIME FORWARD) ==="
          python -m python.src.basketball.daemon --once --days-back 0 --days-forward ${{ github.event.inputs.days_forward || '4' }}

      - name: Execute 250,000 Monte Carlo Basketball Prediction Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "=== RUNNING BASKETBALL 250K MONTE CARLO PREDICTION ENGINE ==="
          DAYS="${{ github.event.inputs.days_forward || '4' }}"
          SIMS="${{ github.event.inputs.simulations || '250000' }}"
          WIPE_FLAG=""
          if [ "${{ github.event.inputs.wipe_all }}" = "true" ]; then
            WIPE_FLAG="--wipe-all"
          fi
          python -m python.src.basketball.run_predictions --days-forward $DAYS --sims $SIMS $WIPE_FLAG

      - name: Dispatch Basketball Prediction Failure Alert
        if: failure()
        env:
          ALERT_EMAIL_SENDER: ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_RECIPIENTS: ${{ secrets.ALERT_EMAIL_RECIPIENTS }}
        run: |
          python -c "
          try:
              from python.src.alerts.email_notifier import send_pipeline_failure_alert
              send_pipeline_failure_alert(
                  'Basketball Prediction Engine (GitHub Actions)',
                  Exception('GitHub Actions Basketball prediction workflow step failed'),
                  {'run_id': '${{ github.run_id }}', 'run_url': 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'}
              )
          except Exception as e:
              print(f'Failed to dispatch email alert: {e}')
          "

      - name: Notify IndexNow (Bing, Yandex) of changed pages
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m python.src.seo.indexnow --sports basketball --since-minutes 60
