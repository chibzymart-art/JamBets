name: JamBets Autonomous Tennis Prediction Engine (Every 2 Days)

on:
  schedule:
    # Run every 2 days at 23:00 UTC to analyze the 4-day forward slate
    - cron: '0 23 */2 * *'
  workflow_dispatch:
    inputs:
      days_ahead:
        description: 'Forward horizon window in days (default: 4 to cover 48h off-day)'
        required: false
        default: '4'
      simulations:
        description: 'Monte Carlo simulations count per match (default: 250000)'
        required: false
        default: '250000'
      dry_run:
        description: 'Simulate without mutating Cloud Supabase'
        type: boolean
        required: false
        default: false
      skip_rankings:
        description: 'Skip scraping ATP/WTA player rankings'
        type: boolean
        required: false
        default: false

concurrency:
  group: tennis-prediction-engine
  cancel-in-progress: false

jobs:
  tennis-prediction-cycle:
    name: Autonomous Tennis Scraping, 250k Monte Carlo & Prediction Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Execute Autonomous Tennis Prediction & Simulation Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ALERT_EMAIL_SENDER: ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_RECIPIENTS: ${{ secrets.ALERT_EMAIL_RECIPIENTS }}
        run: |
          echo "=== RUNNING AUTONOMOUS TENNIS PREDICTION & SIMULATION ENGINE ==="
          DAYS_AHEAD="${{ github.event.inputs.days_ahead || '4' }}"
          SIMULATIONS="${{ github.event.inputs.simulations || '250000' }}"
          
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          SKIP_RANKINGS_FLAG=""
          if [ "${{ github.event.inputs.skip_rankings }}" = "true" ]; then
            SKIP_RANKINGS_FLAG="--skip-rankings"
          fi

          python -m python.src.tennis.run_tennis_predictions \
            --days-ahead "$DAYS_AHEAD" \
            --simulations "$SIMULATIONS" \
            $DRY_RUN_FLAG \
            $SKIP_RANKINGS_FLAG

      - name: Dispatch Prediction Engine Failure Alert
        if: failure()
        env:
          ALERT_EMAIL_SENDER: ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_RECIPIENTS: ${{ secrets.ALERT_EMAIL_RECIPIENTS }}
        run: |
          python -c "
          try:
              from python.src.alerts.email_notifier import send_pipeline_failure_alert
              send_pipeline_failure_alert(
                  'Tennis Prediction Engine (GitHub Actions)',
                  Exception('GitHub Actions 48-hour Tennis prediction engine workflow step failed'),
                  {
                      'run_id': '${{ github.run_id }}',
                      'run_url': 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
                      'workflow': '${{ github.workflow }}'
                  }
              )
          except Exception as e:
              print(f'Failed to dispatch email alert: {e}')
          "
