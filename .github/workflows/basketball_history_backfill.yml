name: Basketball History Backfill (manual only)

# One-off: adds FINISHED games from before the first stored fixture, for ratings history.
# Never runs on a schedule or on push. Never edits existing rows. Creates no predictions.
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'First date YYYYMMDD'
        required: true
        default: '20260101'
      end:
        description: 'Last date YYYYMMDD (blank = day before the first stored fixture)'
        required: false
        default: ''
      dry_run:
        description: 'Only count games, write nothing'
        type: boolean
        required: false
        default: true

concurrency:
  group: basketball-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python/requirements.txt'
      - run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt
      - name: Backfill finished games
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS="--start ${{ github.event.inputs.start }}"
          if [ -n "${{ github.event.inputs.end }}" ]; then ARGS="$ARGS --end ${{ github.event.inputs.end }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m python.src.research.basketball_history_backfill $ARGS
