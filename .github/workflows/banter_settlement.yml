name: Banter Hub Football Pick Settlement

# Marks members' Banter Hub football picks won / lost / void from the results the main system has
# already settled. Separate from every Predictions Hub workflow: it runs on its own schedule
# (:40, after the football settlement at :10), has its own concurrency group, and only reads
# fixtures and predictions. It writes only to football_user_picks.
#
# DRY RUN BY DEFAULT: it only logs what it would do. To go live, set the repository variable
# BANTER_SETTLE_LIVE to "true" (Settings > Secrets and variables > Actions > Variables), or run it by
# hand with "live" ticked. It never fails the run: a missed pass is picked up on the next one.

on:
  schedule:
    - cron: '40 3-22 * * *'
  workflow_dispatch:
    inputs:
      live:
        description: 'Write results (unticked = dry run)'
        type: boolean
        default: false

concurrency:
  group: banter-settlement
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  settle:
    name: Settle Banter football picks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Settle picks (dry run unless BANTER_SETTLE_LIVE is true)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BANTER_SETTLE_LIVE: ${{ (github.event_name == 'workflow_dispatch' && inputs.live) && 'true' || vars.BANTER_SETTLE_LIVE }}
        run: |
          if [ "$BANTER_SETTLE_LIVE" = "true" ]; then
            echo "=== BANTER SETTLEMENT: LIVE ==="
            python -m python.src.banter.football_settlement --live
          else
            echo "=== BANTER SETTLEMENT: DRY RUN (set BANTER_SETTLE_LIVE=true to write) ==="
            python -m python.src.banter.football_settlement
          fi
