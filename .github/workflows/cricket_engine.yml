name: Cricket Prediction Engine

# Hourly: scrape LiveScore fixtures, publish provisional and toss-time
# predictions (inserts only; published rows are locked by the database),
# then settle finished matches. Cricsheet history is cached weekly.

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days ahead to predict'
        required: false
        default: '2'
      dry_run:
        description: 'Run without writing to Supabase'
        type: boolean
        required: false
        default: false

concurrency:
  group: cricket-engine
  cancel-in-progress: false

jobs:
  cricket:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRICKET_DATA_DIR: cricket_data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Week key for the history cache
        id: week
        run: echo "key=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore Cricsheet history
        uses: actions/cache@v4
        with:
          path: cricket_data/history.json.gz
          key: cricsheet-${{ steps.week.outputs.key }}

      - name: Predict
        run: |
          python -m python.src.cricket.run_engine predict \
            --days "${{ github.event.inputs.days || '2' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Settle
        if: always()
        run: |
          python -m python.src.cricket.run_engine settle \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
